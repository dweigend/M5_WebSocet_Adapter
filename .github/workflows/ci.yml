name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install firmware tools
        run: |
          uv venv --allow-existing .venv
          uv pip install --python .venv/bin/python -r requirements-controller.txt

      - name: Build firmware
        run: .venv/bin/pio run -d firmware

      - name: Compile serial probe
        run: .venv/bin/python -m py_compile scripts/probe-m5stick-serial.py
