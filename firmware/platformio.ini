; PlatformIO Project Configuration File
;
; M5Stack documents StickC Plus2 builds with the generic m5stick-c board
; definition and M5Unified for hardware detection.

[env:m5stack-stickc-plus2]
platform = espressif32@6.7.0
board = m5stick-c
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified
    links2004/WebSockets
    bblanchon/ArduinoJson
