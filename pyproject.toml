[project]
name = "m5-websocket-adapter-tools"
version = "0.1.0"
description = "Local Python tooling for M5StickC Plus2 setup, diagnostics, and firmware workflows."
requires-python = ">=3.13"
dependencies = [
  "pyserial==3.5",
  "websockets==16.0",
]

[dependency-groups]
dev = [
  "ruff==0.15.14",
  "ty==0.0.40",
]
firmware = [
  "esptool==5.2.0",
  "platformio==6.1.19",
]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"
